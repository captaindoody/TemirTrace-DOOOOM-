<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#132b23">
  <meta name="description" content="Verifiable maintenance history for equipment">
  <title>TemirTrace — Equipment Passport</title>
  <link rel="stylesheet" href="/assets/main.css">
</head>
<body>
  <div id="root"></div>
  <script>
    const showStartupError = (title, message) => {
      const root = document.getElementById('root');
      if (!root) return;
      const main = document.createElement('main');
      main.style.cssText = 'max-width:720px;margin:60px auto;padding:24px;font:14px system-ui;color:#713b33';
      const heading = document.createElement('h1'); heading.textContent = title;
      const detail = document.createElement('pre'); detail.style.whiteSpace = 'pre-wrap'; detail.textContent = String(message || 'Unknown startup error');
      main.append(heading, detail); root.replaceChildren(main);
    };
    window.addEventListener('error', e => showStartupError('TemirTrace could not load', e.message));
    window.addEventListener('unhandledrejection', e => showStartupError('TemirTrace could not start', e.reason?.message || e.reason));
  </script>
  <script type="module" src="/assets/main.js"></script>
</body>
</html>
